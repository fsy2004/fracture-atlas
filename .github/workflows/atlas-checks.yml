name: Atlas checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content-and-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check model hashes and anatomy
        run: |
          node tools/verify-specimen-library.mjs
          node --test tests/*.test.mjs
      - name: Check generated catalogues
        run: |
          node tools/build_review.mjs
          node tools/build_offline_files.mjs
          git diff --exit-code -- review/catalog.json offline-files.js
