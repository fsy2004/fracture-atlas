name: 3D 模型、动画与软组织问题反馈
description: 反馈骨骼形态异常、穿模、软组织配准偏移、剖视/剥离异常或页面显示 Bug
title: "[模型/动画] "
labels: ["bug", "3d-visual"]
body:
  - type: input
    id: scene
    attributes:
      label: 出现问题的页面链接或骨骼/分型名称
      placeholder: 可点击右上角“复制链接”粘贴（如 #femur/v01/0）
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题现象与复现步骤
      placeholder: 例如：打开右股骨上 1/3 骨折 -> 开启肌肉与血管 -> 拖动移位滑块至 1.6× 时出现……
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 设备与浏览器环境
      placeholder: 例如：Windows 11 / Chrome 130 / iPhone Safari
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: 截图或控制台报错（可选）
      placeholder: 可直接拖入截图，或粘贴浏览器 F12 控制台中的报错信息
    validations:
      required: false
