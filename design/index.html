<a href="../">‹ 返回交互图谱</a><h1>课堂界面方案</h1><p>三张设计稿都用同一个男性右腕伸直型骨折。点选图片可放大查看。</p>
<nav><a href="#porcelain">A · 青瓷解剖图版</a><a href="#biplane">B · 双视图观察台</a><a href="#lecture">C · 课堂讲解卡</a></nav>
<section id="porcelain"><h2>A　青瓷解剖图版</h2><p>瓷白底衬托暖色骨块，以引线指认骨折远段与原位置。</p><a href="porcelain.jpg"><img src="porcelain.jpg" alt="侧面解剖图版，标示远段与伤前轮廓"></a></section>
<section id="biplane"><h2>B　双视图观察台</h2><p>同时比较正面和右侧面，分别辨认桡移与背移。画面均为三维模型的视图。</p><a href="biplane.jpg"><img src="biplane.jpg" alt="深靛蓝双视图，同一骨折时刻"></a></section>
<section id="lecture"><h2>C　课堂讲解卡</h2><p>主图提出方向问题，下方固定保留同一侧面视向的伤前、伤后对照。</p><a href="lecture-card.jpg"><img src="lecture-card.jpg" alt="主图与两个伤前伤后小窗"></a></section></html>
